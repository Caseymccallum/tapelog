# tapelog policy pack: MCP filesystem server
# (@modelcontextprotocol/server-filesystem and compatible)
#
# Philosophy: reads are free, writes are confirmed, secrets and supply
# chain are hard-denied. Copy this file and tune paths to your repo.
version: 1
default: allow

rules:
  # --- hard denies: secrets, keys, supply chain --------------------------
  - id: no-secret-files
    tool: ["read_file", "read_text_file", "read_media_file", "write_file", "edit_file", "move_file"]
    where: 'context.args.path like "*.env*" || context.args.path like "*secret*" || context.args.path like "*credential*" || context.args.path like "*.pem" || context.args.path like "*.key" || context.args.path like "id_rsa*" || context.args.path like "*.p12"'
    action: deny
    reason: "secret material must not cross the agent boundary"

  - id: no-ssh-and-hooks
    tool: ["read_file", "write_file", "edit_file", "create_directory", "move_file"]
    where: 'context.args.path like "*.ssh/*" || context.args.path like "*.git/hooks/*"'
    action: deny
    reason: "SSH keys and git hooks are out of bounds"

  # --- confirm: anything that changes state ------------------------------
  - id: writes-need-confirm
    tool: ["write_file", "edit_file", "create_directory", "move_file", "search_files"]
    action: confirm
    reason: "filesystem mutations need a human in the loop"

  # --- payload caps ------------------------------------------------------
limits:
  max_response_bytes: 2097152

injection:
  mode: log
