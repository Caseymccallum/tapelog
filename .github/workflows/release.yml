name: release

# Tag-triggered release, split so nothing is published before the artifacts it
# would publish have been built, verified on both platforms, and attested.
#
#   build          goreleaser release --skip=publish -> archives, checksums,
#                  cosign signature, SBOMs, provenance attestation
#   verify-linux   extract the Linux archive and execute it
#   verify-windows extract the Windows archive and execute it
#   publish        create the GitHub prerelease from exactly those files
#
# workflow_dispatch backfills an older tag with the same sequencing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to (re)release, e.g. v0.5.0-beta.1"
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # cosign keyless + provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # cosign v3 replaced --output-signature/--output-certificate with
          # --bundle; SECURITY.md documents the .sig/.pem pair, so stay on v2.
          cosign-release: 'v2.6.5'
      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
      - name: Package with the tested script (does not publish)
        run: |
          set -euo pipefail
          TAPELOG_PLATFORMS="windows/amd64 linux/amd64" \
          TAPELOG_MANIFEST_SIGNING="PERFORMED (cosign keyless over checksums.txt by this workflow)" \
          TAPELOG_MANIFEST_SBOM="PRODUCED per archive (syft/SPDX) by this workflow" \
            bash scripts/build-release-candidate.sh "$PWD/dist"
      - name: Sign the checksums (cosign keyless)
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt
      - name: SBOM per archive (syft/SPDX)
        run: |
          set -euo pipefail
          for f in dist/tapelog_*.zip dist/tapelog_*.tar.gz; do
            syft "$f" -o spdx-json > "$f.spdx.json"
          done
      - name: Assert the expected artifacts exist
        run: |
          set -euo pipefail
          ls -l dist
          test -f dist/checksums.txt
          test -f dist/checksums.txt.sig
          test -f dist/checksums.txt.pem
          test "$(ls dist/*windows_amd64.zip | wc -l)" = "1"
          test "$(ls dist/*linux_amd64.tar.gz | wc -l)" = "1"
          test "$(ls dist/*.spdx.json 2>/dev/null | wc -l)" -ge 1
          grep -q 'signing: PERFORMED' dist/MANIFEST.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tapelog_*.zip
            dist/tapelog_*.tar.gz
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/*.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  verify-linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Verify the Linux archive executes and carries the expected payload
        run: bash .github/scripts/verify-linux.sh dist

  verify-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Verify the Windows archive executes and carries the expected payload
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/verify-windows.ps1 -DistDir dist

  publish:
    needs: [build, verify-linux, verify-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish the verified artifacts as a prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes="release-notes/${TAG}.md"
          shopt -s nullglob
          sboms=(dist/*.spdx.json)
          assets=(dist/tapelog_*.zip dist/tapelog_*.tar.gz dist/checksums.txt dist/checksums.txt.sig dist/checksums.txt.pem)
          if [ -f "$notes" ]; then
            gh release create "$TAG" --prerelease --title "Tapelog $TAG" --notes-file "$notes" "${assets[@]}" "${sboms[@]}"
          else
            gh release create "$TAG" --prerelease --title "Tapelog $TAG" --generate-notes "${assets[@]}" "${sboms[@]}"
          fi
          gh release view "$TAG" --json tagName,isPrerelease,assets --jq '{tag:.tagName, prerelease:.isPrerelease, assets:[.assets[].name]}'
