name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what actually happened.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Smallest possible policy/cassette/commands that shows it. Redact secrets — cassettes are already redacted, but double-check.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: `tapelog doctor` output
      description: Run `tapelog doctor --policy <your policy>` and paste the output.
      render: shell
  - type: input
    id: version
    attributes:
      label: tapelog version
      placeholder: "tapelog 0.2.0 (from `tapelog version`)"
    validations:
      required: true
