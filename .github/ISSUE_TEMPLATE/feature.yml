name: Feature request
description: An idea, a missing capability, or a policy pack request
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not paste secrets, unredacted recordings, tokens or private client data.**
        A recording can contain tool arguments and results. Share the `tapelog demo`
        recording, or a recording made against disposable data, and say which it is.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The pain first — solutions second. "As an agent operator, I can't…"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - record / session log
        - policy engine
        - replay / tapelog test
        - tapelog fuzz
        - web dashboard / approval queue
        - policy packs
        - spec (Agent Session Log Format)
        - other
    validations:
      required: true
