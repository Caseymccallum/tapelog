# NOTE: the release workflow does not use this file. It runs
# scripts/build-release-candidate.sh — the same script that produced the accepted
# artifacts — and then signs/SBOMs the result, so the published bytes are the tested
# bytes. This config is kept for other tooling; update both if the packaging changes.
#
# Release flow: push a v* tag (or workflow_dispatch the release workflow)
# and it builds, SBOMs (syft), signs (cosign, SECURITY.md promise),
# attests provenance, and publishes the GitHub Release.
version: 2

project_name: tapelog

before:
  hooks:
    - go mod tidy
    # The archive carries its own provenance; a downloader can read the commit
    # straight out of it without trusting the release page.
    - bash scripts/goreleaser-manifest.sh

builds:
  - id: tapelog
    main: ./cmd/tapelog
    binary: tapelog
    env:
      - CGO_ENABLED=0
    ldflags:
      # The commit is part of the version string a user reads and quotes in a bug
      # report; without it a CI build carries no provenance at all.
      - -s -w -X main.version={{.Version}} -X github.com/Caseymccallum/tapelog/internal/buildinfo.Version={{.Version}} -X github.com/Caseymccallum/tapelog/internal/buildinfo.Commit={{.FullCommit}}
    # The beta offers only the platforms that were built, executed and walked
    # through. macOS and linux/arm64 compile, but publishing them from a build
    # matrix would advertise support nobody has run; add them back only after an
    # executed acceptance pass on those platforms.
    goos: [linux, windows]
    goarch: [amd64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # goreleaser's default is LICENSE/README/CHANGELOG only. A download-only user
    # needs the guides and the fictional demo the guides run, exactly as the local
    # candidate build ships them; without this list CI replaces the tested archive
    # with one whose documented commands cannot run.
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - THIRD_PARTY_NOTICES.md
      - MANIFEST.txt
      - SECURITY.md
      - ARCHITECTURE.md
      - CONTRIBUTING.md
      - GOVERNANCE.md
      - CODE_OF_CONDUCT.md
      - RESEARCH.md
      - STACK.md
      # src/dst keeps the repository path inside the archive. A bare glob entry
      # is archived relative to the glob's own base, which flattened the guides to
      # the root and broke every relative link between them.
      - src: docs/*.md
        strip_parent: false
      - src: docs/adr/*.md
        strip_parent: false
      - src: examples/regression-demo/*
        strip_parent: false

checksum:
  name_template: checksums.txt

# One SBOM per archive (syft) — SECURITY.md promise.
sboms:
  - artifacts: archive

# Sign the checksums file with cosign (keyless via the workflow's OIDC
# identity); one signature covers every artifact hash.
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args: ["sign-blob", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}", "--yes"]
    artifacts: checksum

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
